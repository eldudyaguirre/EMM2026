{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar contraseña · Emaús</title>
  <link rel="shortcut icon" href="{% static 'images/favicon.png' %}">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top right,#3b0717 0,#111116 48%,#0b0b0e 100%);font-family:Arial,sans-serif;color:#fff}
    main{width:min(100%,480px);padding:clamp(24px,5vw,40px);background:#1a1a20;border:1px solid #393941;border-radius:18px;box-shadow:0 24px 80px #0008}
    .brand{color:#ff496d;font-weight:700;letter-spacing:2px;font-size:12px;text-transform:uppercase;margin-bottom:12px}h1{font-size:30px;margin:0 0 12px}.intro{color:#c4c4ce;line-height:1.6;margin-bottom:22px}
    label{display:block;font-weight:700;font-size:14px;margin:16px 0 7px}input{width:100%;padding:13px 14px;background:#101014;border:1px solid #484851;border-radius:9px;color:#fff;font:inherit}input:focus{outline:2px solid #bd0026}
    button,.back{display:inline-block;margin-top:22px;border:0;border-radius:9px;padding:13px 16px;background:#bd0026;color:white;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}.back{margin-left:8px;background:#303038}
    .error{padding:12px;border-radius:9px;background:#431520;border:1px solid #a92c46;color:#ffc2ce;margin-bottom:15px}
  </style>
</head>
<body><main>
  <div class="brand">Ministerio de Música · Emaús</div>
  <h1>Cambiar contraseña</h1>
  <p class="intro">Ingresa tu contraseña actual y luego escribe y confirma la nueva contraseña.</p>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="on">
    {% csrf_token %}
    <label for="password_actual">Contraseña actual</label><input id="password_actual" name="password_actual" type="password" autocomplete="current-password" required autofocus>
    <label for="password_nueva">Nueva contraseña</label><input id="password_nueva" name="password_nueva" type="password" autocomplete="new-password" minlength="8" required>
    <label for="password_confirmacion">Confirmar nueva contraseña</label><input id="password_confirmacion" name="password_confirmacion" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Guardar contraseña</button><a class="back" href="{% url 'loginin' %}">Volver</a>
  </form>
</main>
<script>
document.querySelector('form').addEventListener('submit',function(e){
 const n=document.getElementById('password_nueva').value;
 const c=document.getElementById('password_confirmacion').value;
 if(n!==c){e.preventDefault();alert('La nueva contraseña y su confirmación no coinciden.');}
});
</script>
</body></html>
