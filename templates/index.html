{% load static %}

<!DOCTYPE html>
<html lang="zxx">
<head>
	<!-- Meta -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
	<meta name="description" content="">
	<meta name="keywords" content="">
	<meta name="author" content="Awaiken">
	<!-- Page Title -->
    <title>Emaús - Ministerio de Música</title>
	<!-- Favicon Icon -->
	<link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Phudu:wght@300..900&display=swap" rel="stylesheet">
	<!-- Bootstrap Css -->
	<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" media="screen">
	<!-- SlickNav Css -->
	<link href="{% static 'css/slicknav.min.css' %}" rel="stylesheet">
<!-- Font Awesome Icon Css-->
	<link href="{% static 'css/all.min.css' %}" rel="stylesheet" media="screen">
	<!-- Animated Css -->
	<link href="{% static 'css/animate.css' %}" rel="stylesheet">
<!-- Mouse Cursor Css File -->
	<link rel="stylesheet" href="{% static 'css/mousecursor.css' %}">
<!-- Main Custom Css -->
	<link href="{% static 'css/custom.css' %}" rel="stylesheet" media="screen">

    <style>
        /* Centrar formulario solamente en escritorio. El responsive actual no se modifica. */
        @media (min-width: 1200px) {
            .hero .hero-body {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10;
                pointer-events: none;
            }

            .hero .login-box {
                pointer-events: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Preloader Start -->
	<div class="preloader">
		<div class="loading-container">
			<div class="loading"></div>
			<div id="loading-icon"><img src="{% static 'images/loaderlogo.svg' %}" alt=""></div>
		</div>
	</div>
	<!-- Preloader End -->

    <!-- Header Start -->
	<header class="main-header">
		<div class="header-sticky">
			<nav class="navbar navbar-expand-lg">
				<div class="container">
					<!-- Logo Start -->
					<a class="navbar-brand" href="./">
						<img src="{% static 'images/logomio.svg' %}" alt="Logo">
					</a>
					<!-- Logo End -->

                    <!-- Main Menu Start -->
                    <div class="collapse navbar-collapse main-menu">
                        <div class="nav-menu-wrapper">
                        </div>
                        
                    </div>
                        <!-- Header Btn Start -->
                        <div class="header-btn">
                            <a href="{% url 'contact' %}" class="btn-default btn-highlighted">Contactanos</a>
                        </div>
                        <!-- Header Btn End -->
					<!-- Main Menu End -->
					<div class="navbar-toggle"></div>
				</div>
			</nav>
			<div class="responsive-menu"></div>
		</div>
	</header>
	<!-- Header End -->

    <!-- Hero Section Start -->
    <div class="hero dark-section">
        <!-- Video Start -->
        <div class="hero-bg-video">
            <!-- Selfhosted Video Start -->
             <video autoplay muted playsinline loop id="myvideo"><source src="{% static 'images/emanu-hero-video.mp4' %}" type="video/mp4"></video> 
            <!--<video autoplay muted playsinline loop id="myvideo"><source src="https://demo.awaikenthemes.com/assets/videos/emanu-hero-video.mp4" type="video/mp4"></video>-->
            
            <!-- Selfhosted Video End -->

            <!-- Youtube Video Start -->
            <!-- <div id="herovideo" class="player" data-property="{videoURL:'OjTRVpgtcG4',containment:'.hero-video', showControls:false, autoPlay:true, loop:true, vol:0, mute:false, startAt:0,  stopAt:296, opacity:1, addRaster:true, quality:'large', optimizeDisplay:true}"></div> -->
            <!-- Youtube Video End -->
        </div>
        <!-- Video End -->
        <div class="container">
            <div class="row align-items-end">
                <div class="col-xl-6">
                    <!-- Hero Content Start -->
                    <div class="hero-content">
                        <!-- Section Title Start -->
                        <!-- Section Title End -->

                    </div>
                    <!-- Hero Content End -->
                </div>

                <div class="col-xl-6">
                    <!-- Hero Body Start -->
                <div class="hero-body">
                    
                    <div class="login-box wow fadeInUp">
                        
                        <div class="login-header">
                            <h3>Iniciar Sesión</h3>
                            <p>Accede al cancionero digital</p>
                        </div>

                        <form method="POST">

                        {% csrf_token %}

                        <div class="form-group mb-4">

                            <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Usuario"
                            required>

                        </div>

                        <div class="form-group mb-4">

                            <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Contraseña"
                            required>

                        </div>

                        <div class="form-group mb-3">

                            <button
                            type="submit"
                            class="btn-default btn-highlighted w-100">

                            Entrar

                            </button>

                        </div>

                        {% if error %}

                        <div class="alert alert-danger">

                            {{error}}

                        </div>

                        {% endif %}

                        </form>

                    </div>

                </div>                    <!-- Hero Body End -->
                </div>
            </div>
        </div>
    </div>
    <!-- Hero Section End -->










    <!-- Main Footer Start -->
    <footer class="main-footer bg-section dark-section">

        <!-- Footer Copyright Start -->
        <div class="footer-copyright">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <!-- Footer Copyright Text Start -->
                        <div class="footer-copyright-text">
                            <p>Imashuti © 2026 Todos los derechos reservados.</p>
                        </div>
                        <!-- Footer Copyright Text End -->
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer Copyright End -->
    </footer>
    <!-- Main Footer End -->

    <!-- Jquery Library File -->
    <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
    <!-- Bootstrap js file -->
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <!-- Validator js file -->
    <script src="{% static 'js/validator.min.js' %}"></script>
    <!-- SlickNav js file -->
    <script src="{% static 'js/jquery.slicknav.js' %}"></script>
<!-- Parallax js -->
    <script src="{% static 'js/parallaxie.js' %}"></script>
    <!-- MagicCursor js file -->
    <script src="{% static 'js/gsap.min.js' %}"></script>
    <script src="{% static 'js/magiccursor.js' %}"></script>
    <!-- Text Effect js file -->
    <script src="{% static 'js/SplitText.min.js' %}"></script>
    <script src="{% static 'js/ScrollTrigger.min.js' %}"></script>
</script>
    <!-- Main Custom js file -->
    <script src="{% static 'js/function.js' %}"></script>
</body>
</html>
